name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-extension:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip ChatGPT extension
        working-directory: extension
        run: |
          zip -r ../ai-usage-chatgpt-extension.zip \
            manifest.json \
            background.js \
            core.js \
            bridge.js \
            page-hook.js \
            popup.html \
            popup.css \
            popup.js \
            icons \
            README.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES='本机 AI 用量托盘应用。安装包未做 Apple / Microsoft 商店公证，macOS 请右键打开，Windows 可能被 SmartScreen 拦截。

          解析 sidecar 需要本机已安装 Node.js 20+。

          ## 安装包

          - macOS：`.dmg`（Apple Silicon 与 Intel 各一份）
          - Windows 11：`.msi` / NSIS `.exe`
          - Ubuntu：`.deb` / AppImage
          - 浏览器扩展：`ai-usage-chatgpt-extension.zip`（解压后在 Chrome / Edge 加载已解压的扩展）'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ai-usage-chatgpt-extension.zip --clobber
          else
            gh release create "$TAG" \
              --title "AI Usage ${TAG}" \
              --notes "$NOTES" \
              ai-usage-chatgpt-extension.zip
          fi

  publish-tauri:
    needs: pack-extension
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.pack-extension.outputs.tag }}
          releaseName: AI Usage ${{ needs.pack-extension.outputs.tag }}
          releaseBody: '见本页 Assets 下载各平台安装包与浏览器扩展压缩包。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
